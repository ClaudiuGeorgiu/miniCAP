[project]
name = "miniCAP"
version = "1.1.0"
description = "A simple and minimal microservice for generating and validating CAPTCHA"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite~=0.22",
    "fastapi~=0.162",
    "pillow~=13.0",
    "pydantic~=2.14",
    "sqlalchemy[asyncio]~=2.1",
    "uvicorn~=0.54",
]

[dependency-groups]
dev = [
    "httpx~=0.28",
    "locust~=2.46",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "pytest~=9.2",
    "ruff~=0.17",
    "ty~=0.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["EXE001"]
